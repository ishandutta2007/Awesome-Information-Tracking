<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient for Text & Shapes -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      .bg-grid { animation: pulseGlow 6s ease-in-out infinite; }
      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 9s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 10, 10; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1000" height="260" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Grid -->
  <rect width="1000" height="260" rx="16" fill="url(#grid)" class="bg-grid"/>

  <!-- Ambient Glowing Orbs (Background) -->
  <circle cx="150" cy="80" r="100" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="850" cy="180" r="120" fill="#818cf8" opacity="0.15" filter="url(#glow)"/>

  <!-- Animated Flow Lines in Background -->
  <path d="M -50 130 Q 250 50 500 130 T 1050 130" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.3" class="flow-line"/>

  <!-- Background Floating Decorative Spreadsheet/Database Mock Cards -->
  <g class="floating-card-1" opacity="0.25">
    <rect x="700" y="35" width="220" height="110" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1"/>
    <rect x="715" y="50" width="80" height="10" rx="3" fill="#38bdf8"/>
    <rect x="715" y="70" width="190" height="6" rx="2" fill="#94a3b8"/>
    <rect x="715" y="85" width="160" height="6" rx="2" fill="#94a3b8"/>
    <rect x="715" y="100" width="130" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <g class="floating-card-2" opacity="0.2">
    <rect x="75" y="140" width="180" height="90" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1"/>
    <rect x="90" y="155" width="60" height="8" rx="3" fill="#c084fc"/>
    <rect x="90" y="172" width="150" height="5" rx="2" fill="#64748b"/>
    <rect x="90" y="185" width="120" height="5" rx="2" fill="#64748b"/>
    <rect x="90" y="198" width="140" height="5" rx="2" fill="#64748b"/>
  </g>

  <!-- Main Content Foreground Overlay Container -->
  <rect x="50" y="30" width="900" height="200" rx="12" fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" style="backdrop-filter: blur(8px);"/>

  <!-- Foreground Main Title & Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="500" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="0.5">
      📋 Awesome Information Tracking
    </text>

    <!-- Subtitle -->
    <text x="500" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">
      Curated SaaS Platforms &amp; Open-Source Spreadsheet-Database Hybrids
    </text>
  </g>

  <!-- Foreground Feature Badges / Pills -->
  <g transform="translate(160, 155)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">📊 Relational Grids</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(170, 0)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">⚡ No-Code Apps</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(340, 0)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">🔄 Real-Time Sync</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(510, 0)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">🔓 Self-Hosted</text>
    </g>
  </g>
</svg>
